<!DOCTYPE html>
<html lang="en">
<head>

    <title>Mock Directory - Page 1</title>

        .business-listing { border: 1px solid #ccc; margin: 10px; padding: 10px; }
        .business-name { font-weight: bold; font-size: 1.2em; }
        .phone-number { color: green; }
    </style>
</head>
<body>
    <h1>Business Directory</h1>
    
    <div class="business-listing">
        <div class="business-name">Tech Solutions Inc.</div>
        <div class="phone-number">+91 98765 43210</div>

        <div class="rating">4.5</div>
        <div class="review-count">120 reviews</div>

    <div class="business-listing">
        <div class="business-name">Bloom Flowers</div>
        <div class="phone-number">022-12345678</div>

        <!-- No website -->
        <div class="rating">4.0</div>
        <div class="review-count">50 reviews</div>
    </div>

    <div class="pagination">
        <span class="current">1</span>
        <a href="mock_page_2.html" class="pagination-next">Next</a>
